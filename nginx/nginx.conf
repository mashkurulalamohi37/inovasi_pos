# Pulse POS — Nginx production reverse proxy
# Place TLS certificate files at:
#   nginx/certs/fullchain.pem   (certificate + chain)
#   nginx/certs/privkey.pem     (private key)
#
# For Let's Encrypt, use Certbot and copy/symlink the files here.
#
# This file replaces /etc/nginx/nginx.conf wholesale (see docker-compose.prod.yml
# bind mount), so it must be a complete config: events{} + http{} wrapping the
# server blocks — bare server{} blocks at the top level are invalid.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # --- Rate limiting (defense-in-depth; primary control is the Redis-backed
    # limiter in the FastAPI app itself — see backend/app/middleware/rate_limit.py) ---
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_status 429;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME challenge for Let's Encrypt renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        # nginx has no env-var substitution for a directly bind-mounted nginx.conf
        # (that only works via the image's /etc/nginx/templates/*.template + envsubst
        # mechanism, which isn't wired up here). Replace with your real domain at deploy time.
        server_name app.example.com;

        # --- TLS ---
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # --- Security Headers ---
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

        # --- Gzip ---
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_proxied any;
        gzip_min_length 1024;

        # --- Logging ---
        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log warn;

        # --- Auth: proxy to FastAPI with reverse-proxy rate limiting ---
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_buffering    off;
            proxy_pass_header  X-RateLimit-Limit;
            proxy_pass_header  X-RateLimit-Remaining;
        }

        # --- API: proxy to FastAPI backend ---
        location /api/ {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_buffering    off;

            # Rate limit headers pass-through
            proxy_pass_header  X-RateLimit-Limit;
            proxy_pass_header  X-RateLimit-Remaining;
        }

        # --- Static uploads (profile pics, receipts, food images) ---
        location /uploads/ {
            proxy_pass       http://backend:8000;
            proxy_set_header Host $host;
            expires          7d;
            add_header       Cache-Control "public, immutable";
        }

        location /food-images/ {
            proxy_pass       http://backend:8000;
            proxy_set_header Host $host;
            expires          7d;
            add_header       Cache-Control "public, immutable";
        }

        # --- Health / metrics (restrict metrics to internal network only) ---
        location /health {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        location /metrics {
            # Block external access — metrics are scraped by Prometheus internally
            allow 172.16.0.0/12;  # Docker bridge network range
            deny all;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        # --- Frontend: Next.js / Vite ---
        location / {
            proxy_pass         http://pulse-pos:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                proxy_pass http://pulse-pos:3000;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
